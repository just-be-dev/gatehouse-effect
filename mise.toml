[settings]
experimental = true
pin = true

[hooks]
postinstall = "bun install --frozen-lockfile"

[env]
_.path = "node_modules/.bin"

[tasks.check]
description = "Typecheck, lint, test, and check formatting"
run = "bun run typecheck && bun run lint && bun run test && bun run format:check"

[tasks.typecheck]
alias = ["type-check"]
run = "bun run typecheck"

[tasks.lint]
run = "bun run lint"

[tasks.format]
run = "bun run format"

[tasks."format:check"]
run = "bun run format:check"

[tasks.test]
run = "bun run test"

[tasks."test:watch"]
run = "bun run test:watch"

[tasks.build]
description = "Emit dist/ (ESM + declarations) with tsrs"
run = "bun run build"

[tasks.docs]
description = "Generate the TypeDoc site into docs/"
run = "bun run docs"

[tasks.deploy]
description = "Deploy the docs site"
run = "bun run deploy"
depends = ["docs"]

[tasks.prepare]
description = "Patch tsrs with the Effect language service"
run = "bun run prepare"

[tasks."effect-solutions"]
description = "Browse Effect Solutions guides, e.g. `list` or `show <topic>`"
run = "bunx effect-solutions"

[tools]
bun = "1.4.5"
node = "24.22.3"
